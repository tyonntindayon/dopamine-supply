<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ドーパミン供給場</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #090812;
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 24px 7%;
      border-bottom: 1px solid #29233d;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h2 { letter-spacing: 3px; }
    header span, h1 span { color: #a78bfa; }
    .hero {
      padding: 100px 10%;
      background: radial-gradient(circle at 80% 40%, #302052, #090812 60%);
      min-height: 420px;
    }
    .hero h1 { font-size: clamp(45px, 8vw, 80px); margin: 20px 0; }
    .hero p { color: #aaa1bd; line-height: 2; }
    .button {
      display: inline-block;
      background: #a78bfa;
      color: #100b1d;
      padding: 15px 25px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 20px;
      border-radius: 5px;
    }
    main { padding: 65px 10%; }
    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(230px,1fr));
      gap: 20px;
    }
    .game {
      background: #171326;
      border: 1px solid #38304f;
      border-radius: 10px;
      padding: 25px;
      min-height: 170px;
    }
    .game h3 { font-size: 24px; }
    .game p { color: #aaa1bd; }
    .game a { color: #c4b5fd; }
    footer {
      padding: 30px;
      text-align: center;
      color: #777087;
      border-top: 1px solid #29233d;
    }
  </style>
</head>
<body>
  <header>
    <h2>DOPAMINE <span>SUPPLY</span></h2>
    <span>BY TGAMES</span>
  </header>

  <section class="hero">
    <p>YOUR ARCADE IS OPEN</p>
    <h1>退屈な時間に、<br><span>刺激を。</span></h1>
    <p>PLAY SOMETHING NEW.</p>
    <a href="#games" class="button">ゲームを探す ↓</a>
  </section>

  <main id="games">
    <h2>GAMES / ゲーム一覧</h2>
    <div class="games">
      <div class="game">
        <h3>DoPa Ball</h3>
        <p>ARCADE / TGAMES ORIGINAL</p>
        <a href="#">COMING SOON</a>
      </div>
      <div class="game">
        <h3>DOPAUP ⇧</h3>
        <p>ACTION / TGAMES ORIGINAL</p>
        <a href="#">COMING SOON</a>
      </div>
    </div>
  </main>

  <footer>
    © 2026 TGAMES | DOPAMINE SUPPLY
  </footer>
</body>
</html>
