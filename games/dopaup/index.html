<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#090b10">
<title>DOPAUP⇧ Prototype 0.6.1</title>
<style>
:root{color-scheme:dark;--acid:#d7ff35;--violet:#a855f7;--ink:#090b10;--panel:#151922;--line:#303744}
*{box-sizing:border-box}
body{margin:0;background:#090b10;color:#f4f5f7;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;min-height:100vh}
#wrap{width:min(100vw,520px);padding:17px 14px 22px;display:flex;flex-direction:column;gap:11px}
header{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 5px}
.brand{display:flex;align-items:center;gap:10px}.brandmark{width:31px;height:31px;background:var(--acid);color:#10130b;display:grid;place-items:center;font-weight:1000;font-size:21px;transform:skew(-8deg);box-shadow:4px 4px 0 #7851b8}
.logo{font-weight:1000;font-size:clamp(25px,7vw,35px);letter-spacing:-2px;line-height:1}.logo span{color:var(--acid)}
.subbrand{font-size:8px;letter-spacing:2px;color:#9ca4b2;font-weight:800;margin-top:4px}
.pill{font-size:9px;letter-spacing:1.5px;color:var(--acid);border:1px solid #56622b;background:#202719;border-radius:4px;padding:7px 9px;font-weight:900}
#hud{display:grid;grid-template-columns:1.2fr 1fr;gap:8px}
.stat{background:linear-gradient(135deg,#1b202a,#12161d);border:1px solid var(--line);border-left:3px solid var(--acid);padding:9px 13px;border-radius:5px;position:relative;overflow:hidden}.stat:last-child{border-left-color:var(--violet)}
.stat small{display:block;color:#87909e;font-size:9px;letter-spacing:2px;font-weight:900}.stat strong{font-size:27px;line-height:1.2;font-weight:950;letter-spacing:-1px;font-variant-numeric:tabular-nums}.stat strong em{font-style:normal;color:var(--acid);font-size:12px;letter-spacing:1px;margin-left:4px}
#gamebox{position:relative;border:1px solid #39404c;border-radius:7px;overflow:hidden;background:#11151d;box-shadow:0 18px 45px #0009}#gamebox:before{content:"";position:absolute;z-index:1;inset:0;pointer-events:none;border:1px solid #ffffff0b}
canvas{display:block;width:100%;height:auto;touch-action:none}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#090b10d9,#171322e8);padding:24px;text-align:center;z-index:2}
.panel{background:linear-gradient(145deg,#1d2330,#11151d);border:1px solid #59633a;border-radius:7px;padding:25px 19px 21px;max-width:310px;width:100%;box-shadow:8px 8px 0 #a855f733,0 18px 45px #0009;position:relative}.panel:before{content:"DOPAMINE SUPPLY / ARCADE UNIT 02";display:block;color:var(--acid);font-size:8px;letter-spacing:1.8px;font-weight:900;margin-bottom:13px}
.panel h1{margin:0 0 8px;font-size:30px;letter-spacing:-1.5px;font-weight:1000}.panel p{color:#aeb6c3;font-size:12px;line-height:1.75;margin:10px 0 19px}
button{border:0;border-radius:4px;background:var(--acid);color:#11150a;font-weight:1000;font-size:14px;letter-spacing:1.5px;padding:13px 25px;cursor:pointer;box-shadow:4px 4px 0 #a855f7;transition:transform .08s}button:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #a855f7}
#hint{font-size:10px;color:#87909e;text-align:center;line-height:1.9;letter-spacing:.3px}kbd{background:#202630;border:1px solid #414b5a;border-radius:3px;padding:2px 6px;color:var(--acid);font-weight:800}.footerline{display:flex;justify-content:space-between;color:#555e6b;font-size:8px;letter-spacing:1.5px;font-weight:900;padding:0 3px}
</style>
</head>
<body>
<div id="wrap">
<header><div class="brand"><div class="brandmark">↑</div><div><div class="logo">DOPAUP<span>⇧</span></div><div class="subbrand">DOPAMINE SUPPLY / VERTICAL ARCADE</div></div></div><div class="pill">TEST BUILD 06.1</div></header>
<div id="hud"><div class="stat"><small>CURRENT FLOOR</small><strong id="floor">0<em>F</em></strong></div><div class="stat"><small>RUN RECORD</small><strong id="best">0<em>F</em></strong></div></div>
<div id="gamebox">
<canvas id="game" width="480" height="720" aria-label="DOPAUP game"></canvas>
<div id="overlay"><div class="panel"><h1 id="ovtitle">DOPAUP<span style="color:#b8ff69">⇧</span></h1><p id="ovtext">自動で左右に走るキャラクターを、ジャンプさせて上へ導こう。壁に当たると向きが変わる。</p><button id="start">START</button></div></div>
</div>
<div id="hint">TAP / <kbd>SPACE</kbd> / <kbd>↑</kbd>　JUMP TO CLIMB<br>壁で反転 ・ 足場から落下するとRUN終了</div><div class="footerline"><span>DOPAUP⇧ // PROTOTYPE 0.6.1</span><span>CLIMB YOUR LIMIT.</span></div>
</div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=480,H=720,LEFT=42,RIGHT=438,GRAVITY=.42,JUMP=-10.8,SPEED=2.55;
const floorEl=document.getElementById('floor'),bestEl=document.getElementById('best'),overlay=document.getElementById('overlay'),startBtn=document.getElementById('start'),ovtitle=document.getElementById('ovtitle'),ovtext=document.getElementById('ovtext');
let running=false,player,platforms,cameraY,floor,best,frame,lastTime,nextLevel,lastWallSide;
const rand=(a,b)=>a+Math.random()*(b-a);
function makeNextPlatform(previous){
 const level=nextLevel++;
 const safe=level%5===0;
 // 安全地帯の直前は通常ジャンプだけでは届かない高さにする
 const w=safe?220:rand(132,154),minOverlap=safe?92:76;
 const minX=Math.max(LEFT+10,previous.x-w+minOverlap);
 const maxX=Math.min(RIGHT-10-w,previous.x+previous.w-minOverlap);
 const x=rand(minX,maxX);
 // 壁の左右は「壁がある足場」だけで交互に切り替える。
 // 壁なし安全地帯では lastWallSide を変更しないため、次の壁は直前の壁の反対側になる。
 const wallSide=safe?null:(lastWallSide=lastWallSide==='left'?'right':'left');
 const rise=safe?158:78;
 return {x,y:previous.y-rise-rand(0,3),w,h:14,base:false,level,wallSide,safe};
}
function reset(){
 floor=0;best=0;cameraY=0;frame=0;nextLevel=1;lastWallSide='right';
 player={x:110,y:590,vx:SPEED,vy:0,w:27,h:34,onGround:false,jumpBuffer:0,coyote:0,jumpsUsed:0};
 platforms=[{x:68,y:630,w:344,h:18,base:true,level:0}];
 for(let i=0;i<14;i++)platforms.push(makeNextPlatform(platforms[platforms.length-1]));
 floorEl.textContent='0';bestEl.textContent='0';
}
function jump(){if(running&&player.jumpsUsed<2)player.jumpBuffer=10;}
function start(){reset();running=true;overlay.style.display='none';lastTime=performance.now();requestAnimationFrame(loop);}
function end(){running=false;overlay.style.display='flex';ovtitle.textContent='GAME OVER';ovtext.textContent='到達階層：'+floor+'　/　今回の最高：'+best+'階。もう一度挑戦して記録を更新しよう。';startBtn.textContent='RETRY';}
function addPlatforms(){
 let top=Math.min(...platforms.map(p=>p.y));
 while(top>cameraY-950){const previous=platforms.reduce((a,b)=>a.y<b.y?a:b);const p=makeNextPlatform(previous);platforms.push(p);top=p.y;}
 platforms=platforms.filter(p=>p.y<cameraY+H+120);
}
function update(){
 frame++;
 if(player.jumpBuffer>0)player.jumpBuffer--;
 if(player.coyote>0)player.coyote--;
 player.x+=player.vx;
 // 足場の切れ目側にだけ壁を置く。安全地帯には壁を置かない。
 for(const p of platforms){
  if(p.base||!p.wallSide)continue;
  const wx=p.wallSide==='left'?p.x-16:p.x+p.w;
  const touching=player.y+player.h>p.y-72&&player.y<p.y+14&&player.x+player.w>wx&&player.x<wx+16;
  if(touching){
   if(p.wallSide==='left'&&player.vx<0){player.x=wx+16;player.vx=SPEED;}
   if(p.wallSide==='right'&&player.vx>0){player.x=wx-player.w;player.vx=-SPEED;}
  }
 }
 player.x=Math.max(-player.w+8,Math.min(W-8,player.x));
 const oldBottom=player.y+player.h;player.vy+=GRAVITY;player.y+=player.vy;player.onGround=false;
 if(player.vy>=0){
  for(const p of platforms){
   if(oldBottom<=p.y+3&&player.y+player.h>=p.y&&player.x+player.w>p.x&&player.x<p.x+p.w){
    player.y=p.y-player.h;player.vy=0;player.onGround=true;player.coyote=8;player.jumpsUsed=0;
    if(!p.base&&p.level>floor){floor=p.level;best=Math.max(best,floor);floorEl.textContent=floor;bestEl.textContent=best;}
    break;
   }
  }
 }
 if(player.jumpBuffer>0&&player.jumpsUsed<2){
  player.vy=JUMP;player.onGround=false;player.coyote=0;player.jumpsUsed++;player.jumpBuffer=0;
 }
 const target=player.y-H*.48;if(target<cameraY)cameraY+=(target-cameraY)*.14;
 addPlatforms();if(player.y-cameraY>H+75)end();
}
function draw(){
 ctx.clearRect(0,0,W,H);
 const altitude=Math.max(0,-cameraY),sky=ctx.createLinearGradient(0,0,0,H);
 if(altitude<1500){sky.addColorStop(0,'#263b58');sky.addColorStop(.55,'#182638');sky.addColorStop(1,'#111923');}
 else if(altitude<3600){sky.addColorStop(0,'#51416f');sky.addColorStop(.55,'#29334e');sky.addColorStop(1,'#172130');}
 else{sky.addColorStop(0,'#17152e');sky.addColorStop(.55,'#242b50');sky.addColorStop(1,'#111827');}
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 const parallax=(cameraY*.22)%260;
 for(let layer=0;layer<2;layer++){const baseY=H-35+parallax+layer*115;for(let i=0;i<13;i++){const bw=25+(i*17%31),bx=(i*43+layer*19)%W,bh=65+((i*71+layer*37)%155),by=baseY-bh;ctx.fillStyle=layer===0?'#101b2c':'#1a2940';ctx.fillRect(bx,by,bw,bh);ctx.fillStyle='#d7ff3530';for(let wy=by+10;wy<baseY-8;wy+=15)for(let wx=bx+6;wx<bx+bw-4;wx+=11)ctx.fillRect(wx,wy,4,5);}}
 if(altitude>1200){const cloudShift=(cameraY*.38)%250;for(let i=0;i<7;i++){const x=(i*91+23)%W,y=((i*127+cloudShift)%850)-70;ctx.fillStyle=altitude>3600?'#c9d7ff20':'#d8e4f522';ctx.beginPath();ctx.ellipse(x,y,48,12,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(x+18,y-7,25,13,0,0,Math.PI*2);ctx.fill();}}
 ctx.fillStyle='#080d1680';ctx.fillRect(0,0,LEFT,H);ctx.fillRect(RIGHT,0,W-RIGHT,H);
 ctx.save();ctx.translate(0,-cameraY);
 for(let y=Math.floor(cameraY/60)*60;y<cameraY+H+60;y+=60){ctx.strokeStyle='#d7ff350b';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(LEFT,y);ctx.lineTo(RIGHT,y);ctx.stroke();}
 for(const p of platforms){
  if(!p.base&&p.wallSide){
   const wx=p.wallSide==='left'?p.x-16:p.x+p.w;
   ctx.fillStyle='#8793a8';ctx.fillRect(wx,p.y-72,16,86);
   ctx.fillStyle='#d7ff35';ctx.fillRect(wx,p.y-72,16,4);ctx.fillRect(wx,p.y+10,16,4);
   ctx.fillStyle='#ffffff66';ctx.fillRect(wx+(p.wallSide==='left'?12:0),p.y-72,4,86);
   ctx.fillStyle='#30394a';for(let wy=p.y-58;wy<p.y+5;wy+=18)ctx.fillRect(wx+3,wy,10,3);
  }
  ctx.fillStyle=p.base?'#69734a':p.safe?'#526b45':'#414b5b';ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.fillStyle=p.base||p.safe?'#d7ff35':'#a855f7';ctx.fillRect(p.x,p.y,p.w,4);
  if(!p.base){ctx.fillStyle='#ffffff18';ctx.fillRect(p.x+7,p.y+7,Math.max(0,p.w-14),2);}
 }
 ctx.fillStyle='#0005';ctx.fillRect(player.x+3,player.y+player.h+3,player.w,5);
 ctx.fillStyle='#d7ff35';ctx.fillRect(player.x,player.y,player.w,player.h);
 ctx.fillStyle='#243016';ctx.fillRect(player.x+(player.vx>0?17:5),player.y+9,5,5);
 ctx.fillStyle='#eaffd2';ctx.fillRect(player.x+5,player.y+5,6,5);
 ctx.fillStyle='#a855f7';ctx.fillRect(player.x+4,player.y+player.h-5,player.w-8,5);
 ctx.restore();
 ctx.fillStyle='#d7ff35';ctx.font='900 11px system-ui';ctx.fillText('↑  CLIMB HIGHER',18,27);
 ctx.fillStyle='#dce4f0';ctx.font='800 9px system-ui';ctx.textAlign='right';ctx.fillText(altitude<1500?'CITY LEVEL':altitude<3600?'ABOVE THE CLOUDS':'HIGH ALTITUDE',W-18,27);ctx.textAlign='left';
}
function loop(t){if(!running)return;const dt=Math.min((t-lastTime)/16.67,2);lastTime=t;for(let i=0;i<Math.max(1,Math.round(dt));i++)update();draw();if(running)requestAnimationFrame(loop);}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();jump();});
window.addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!running)start();else jump();}});
startBtn.addEventListener('click',start);reset();draw();
})();
</script>
</body>
</html>
