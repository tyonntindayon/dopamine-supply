<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#090b10">
<title>DOPAUP⇧ Prototype 0.8.0</title>
<style>
:root{color-scheme:dark;--acid:#eaff35;--violet:#b64cff;--cyan:#36e8ff;--ink:#080711;--panel:#151225;--line:#42345d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,#28204a 0%,#100e1d 42%,#07070d 100%);color:#fff;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;min-height:100vh}
#wrap{width:min(100vw,520px);padding:19px 14px 24px;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;padding:2px 3px 7px}
.brand{display:flex;align-items:center;gap:11px}.brandmark{width:38px;height:38px;background:linear-gradient(135deg,var(--acid),#8dff9c);color:#10130b;display:grid;place-items:center;font-weight:1000;font-size:27px;transform:skew(-9deg) rotate(-3deg);box-shadow:4px 4px 0 var(--violet),0 0 22px #d7ff3555}
.logo{font-weight:1000;font-size:clamp(28px,7vw,38px);letter-spacing:-2.5px;line-height:.95;text-shadow:0 0 18px #b64cff55}.logo span{color:var(--acid)}
.subbrand{font-size:8px;letter-spacing:2.2px;color:#a99dc7;font-weight:900;margin-top:6px}
.pill{font-size:9px;letter-spacing:1.5px;color:var(--acid);border:1px solid #75642b;background:#292318;border-radius:3px;padding:8px 10px;font-weight:1000;box-shadow:0 0 15px #eaff3518;transform:rotate(2deg)}
#hud{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{background:linear-gradient(125deg,#29203e,#151323 72%);border:1px solid #57466f;border-left:4px solid var(--acid);padding:10px 14px;border-radius:5px;position:relative;overflow:hidden;box-shadow:4px 4px 0 #090711,0 0 18px #a855f722}.stat:after{content:"";position:absolute;width:75px;height:75px;right:-25px;top:-35px;border:1px solid #ffffff18;transform:rotate(45deg)}.stat:last-child{border-left-color:var(--cyan)}
.stat small{display:block;color:#b5a9cc;font-size:9px;letter-spacing:2px;font-weight:1000}.stat strong{font-size:31px;line-height:1.25;font-weight:1000;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;text-shadow:0 0 15px #eaff3533}.stat strong em{font-style:normal;color:var(--acid);font-size:12px;letter-spacing:1px;margin-left:4px}#soundToggle{grid-column:1/-1;justify-self:end;background:#211a32;color:#eaff35;border:1px solid #75608f;padding:7px 12px;font-size:10px;letter-spacing:1px;box-shadow:none}#comboStat{border-left-color:#b64cff}#comboStat strong{color:#eaff35}
#gamebox{touch-action:none;position:relative;border:2px solid #75608f;border-radius:8px;overflow:hidden;background:#11151d;box-shadow:0 0 0 3px #171124,0 0 28px #a855f744,0 18px 45px #000b}#gamebox:before{content:"";position:absolute;z-index:1;inset:0;pointer-events:none;border:1px solid #ffffff22;background:linear-gradient(180deg,#ffffff08,transparent 18%,transparent 82%,#0003)}
canvas{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#080711d9,#211333e8);padding:24px;text-align:center;z-index:2}
.panel{background:linear-gradient(145deg,#29203e,#100e1b);border:1px solid var(--acid);border-radius:8px;padding:27px 19px 23px;max-width:310px;width:100%;box-shadow:7px 7px 0 var(--violet),0 0 35px #b64cff55;position:relative}.panel:before{content:"✦ DOPAMINE SUPPLY / ARCADE UNIT 02 ✦";display:block;color:var(--acid);font-size:8px;letter-spacing:1.4px;font-weight:1000;margin-bottom:14px}
.panel h1{margin:0 0 8px;font-size:34px;letter-spacing:-2px;font-weight:1000;text-shadow:0 0 18px #b64cff88}.panel p{color:#c2b8d2;font-size:12px;line-height:1.8;margin:10px 0 20px}
button{border:0;border-radius:4px;background:linear-gradient(100deg,var(--acid),#b9ff74);color:#11150a;font-weight:1000;font-size:14px;letter-spacing:2px;padding:14px 29px;cursor:pointer;box-shadow:4px 4px 0 var(--violet),0 0 20px #eaff3544;transition:transform .08s}button:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--violet)}
#hint{font-size:10px;color:#b3a7c9;text-align:center;line-height:2;letter-spacing:.5px}
#characterPicker{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:0 0 16px}.charChoice{padding:8px 3px 7px;background:#171326;color:#cfc5df;border:1px solid #57466f;border-radius:5px;box-shadow:none;letter-spacing:0;font-size:9px;line-height:1.4;display:flex;flex-direction:column;align-items:center;gap:5px}.charChoice.active{border:2px solid var(--acid);background:#30283d;color:#fff;box-shadow:0 0 14px #eaff3544}.charPreview{width:30px;height:38px;image-rendering:pixelated;display:block}.charName{font-weight:1000;letter-spacing:.4px}.panel p{margin-bottom:13px}kbd{background:#241d35;border:1px solid #675582;border-radius:3px;padding:2px 6px;color:var(--acid);font-weight:900}.footerline{display:flex;justify-content:space-between;color:#786d8b;font-size:8px;letter-spacing:1.5px;font-weight:1000;padding:0 3px}
</style>
</head>
<body>
<div id="wrap">
<header><div class="brand"><div class="brandmark">↑</div><div><div class="logo">DOPAUP<span>⇧</span></div><div class="subbrand">DOPAMINE SUPPLY / VERTICAL ARCADE</div></div></div><div class="pill">TEST BUILD 08.0</div></header>
<div id="hud"><div class="stat"><small>CURRENT FLOOR</small><strong id="floor">1<em>F</em></strong></div><div class="stat"><small>RUN RECORD</small><strong id="best">1<em>F</em></strong></div><div class="stat" id="comboStat"><small>COMBO</small><strong id="combo">0<em>×</em></strong></div><button id="soundToggle" type="button">SOUND: OFF</button></div>
<div id="gamebox">
<canvas id="game" width="480" height="720" aria-label="DOPAUP game"></canvas>
<div id="overlay"><div class="panel"><h1 id="ovtitle">DOPAUP<span style="color:#b8ff69">⇧</span></h1><p id="ovtext">キャラクターを選んで、上を目指そう！</p><div id="characterPicker" aria-label="キャラクター選択"><button class="charChoice" data-char="0"><canvas class="charPreview" width="30" height="38"></canvas><span class="charName">LIME RUNNER</span></button><button class="charChoice" data-char="1"><canvas class="charPreview" width="30" height="38"></canvas><span class="charName">PURPLE POP</span></button><button class="charChoice" data-char="2"><canvas class="charPreview" width="30" height="38"></canvas><span class="charName">CYBER BLUE</span></button></div><button id="start">START</button></div></div>
</div>
<div id="hint">TAP / <kbd>SPACE</kbd> / <kbd>↑</kbd>　JUMP TO CLIMB<br>壁で反転 ・ 足場から落下するとRUN終了</div><div class="footerline"><span>DOPAUP⇧ // PROTOTYPE 0.8.0</span><span>CLIMB YOUR LIMIT.</span></div>
</div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=480,H=720,LEFT=42,RIGHT=438,GRAVITY=.40,JUMP=-8.0,SPEED=3.15;
const floorEl=document.getElementById('floor'),bestEl=document.getElementById('best'),comboEl=document.getElementById('combo'),soundBtn=document.getElementById('soundToggle'),overlay=document.getElementById('overlay'),startBtn=document.getElementById('start'),ovtitle=document.getElementById('ovtitle'),ovtext=document.getElementById('ovtext');
let running=false,player,platforms,cameraY,floor,best,frame,lastTime,nextLevel,lastWallSide;
let combo=0,particles=[],popups=[],soundMuted=true,audioCtx=null;
const characters=[{name:'LIME RUNNER',hair:'#26351b',skin:'#ffd2a1',top:'#d7ff35',trim:'#a855f7',pants:'#28334a'},{name:'PURPLE POP',hair:'#40205f',skin:'#f4bd9a',top:'#b64cff',trim:'#eaff35',pants:'#282044'},{name:'CYBER BLUE',hair:'#172d50',skin:'#e8c5a5',top:'#36e8ff',trim:'#ffffff',pants:'#1d3550'}];
let selectedCharacter=0;try{selectedCharacter=Math.max(0,Math.min(2,Number(localStorage.getItem('dopaup_character'))||0));}catch(e){}
try{soundMuted=localStorage.getItem('dopaup_muted')!=='false';}catch(e){}
try{best=Math.max(1,Number(localStorage.getItem('dopaup_best'))||1);}catch(e){best=1;}
function playTone(freq=440,duration=.08,type='sine',volume=.045){if(soundMuted)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime);g.gain.setValueAtTime(volume,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration);}catch(e){}}
function syncSoundButton(){soundBtn.textContent='SOUND: '+(soundMuted?'OFF':'ON');}
const rand=(a,b)=>a+Math.random()*(b-a);
function makeNextPlatform(previous){
 const level=nextLevel++;
 // 1階と10階ごとは両側に壁。5階ごとの壁なし区間は10階を除く。
 const bothWalls=level===1||level%10===0;
 const noWall=!bothWalls&&level%5===0;
 const w=noWall?260:200;
 // 直前だけでなく2階層前とも十分に重なる位置に限定し、壁の挟み込みを防ぐ。
 const recent=platforms.filter(p=>!p.base).slice(-2);
 const requiredOverlap=138;
 let minX=Math.max(LEFT+10,previous.x+requiredOverlap-w,previous.x-70);
 let maxX=Math.min(RIGHT-10-w,previous.x+previous.w-requiredOverlap,previous.x+70);
 if(recent.length>=2){
  const twoBack=recent[0];
  minX=Math.max(minX,twoBack.x+requiredOverlap-w);
  maxX=Math.min(maxX,twoBack.x+twoBack.w-requiredOverlap);
 }
 // 通常は候補範囲から選択。範囲が狭い場合も直前の足場に寄せて安全側に配置。
 const x=minX<=maxX?rand(minX,maxX):Math.max(LEFT+10,Math.min(RIGHT-10-w,previous.x+(previous.w-w)/2));
 // 両壁・壁なし階は左右交互の順番に影響させず、片側壁だけ交互に切り替える。
 const wallSide=bothWalls?'both':noWall?null:(lastWallSide=lastWallSide==='left'?'right':'left');
 const rise=76;
 return {x,y:previous.y-rise-rand(0,3),w,h:14,base:false,level,wallSide,safe:noWall};
}
function reset(){
 floor=1;best=Math.max(1,best||1);cameraY=0;frame=0;nextLevel=2;lastWallSide='left';combo=0;particles=[];popups=[];comboEl.innerHTML='0<em>×</em>';
 player={x:110,y:590,vx:SPEED,vy:0,w:27,h:34,onGround:false,jumpBuffer:0,coyote:0,jumpsUsed:0};
 platforms=[{x:68,y:630,w:344,h:18,base:true,level:1,wallSide:'both'}];
 for(let i=0;i<14;i++)platforms.push(makeNextPlatform(platforms[platforms.length-1]));
 floorEl.textContent='1';bestEl.textContent='1';
}
function drawCharacter(target,x,y,type,anim=0){const ch=characters[type]||characters[0],u=3;target.save();target.translate(Math.round(x),Math.round(y));target.imageSmoothingEnabled=false;const px=(a,b,w,h,color)=>{target.fillStyle=color;target.fillRect(a*u,b*u,w*u,h*u);};
 // 9x11 pixel-art chibi runner: hair, face, hoodie, hands and sneakers
 px(2,0,5,2,ch.hair);px(1,1,2,2,ch.hair);px(6,1,2,2,ch.hair);px(2,2,5,3,ch.skin);px(1,2,1,2,ch.hair);px(7,2,1,2,ch.hair);
 px(3,3,1,1,'#242033');px(6,3,1,1,'#242033');px(4,4,2,1,'#ffffff');px(2,5,5,1,ch.top);px(1,6,7,3,ch.top);px(0,6,2,2,ch.skin);px(7,6,2,2,ch.skin);px(3,6,3,1,ch.trim);px(2,9,2,1,ch.pants);px(5,9,2,1,ch.pants);px(1,10,3,1,ch.trim);px(5,10,3,1,ch.trim);
 // subtle alternating foot pixels
 if(Math.floor(anim/8)%2){px(1,10,3,1,ch.pants);px(5,10,3,1,ch.trim);}target.restore();}
function renderCharacterPicker(){document.querySelectorAll('.charChoice').forEach((button,index)=>{button.classList.toggle('active',index===selectedCharacter);const c=button.querySelector('canvas').getContext('2d');c.clearRect(0,0,30,38);drawCharacter(c,1,2,index,frame||0);});}
function jump(){if(running&&player.jumpsUsed<1){player.jumpBuffer=10;playTone(520,.055,'triangle',.025);}}
function start(){reset();running=true;overlay.style.display='none';lastTime=performance.now();requestAnimationFrame(loop);}
function end(){running=false;try{localStorage.setItem('dopaup_best',String(best));}catch(e){}overlay.style.display='flex';ovtitle.textContent='GAME OVER';ovtext.textContent='到達階層：'+floor+'　/　今回の最高：'+best+'階。もう一度挑戦して記録を更新しよう。';startBtn.textContent='RETRY';}
function addPlatforms(){
 let top=Math.min(...platforms.map(p=>p.y));
 while(top>cameraY-950){const previous=platforms.reduce((a,b)=>a.y<b.y?a:b);const p=makeNextPlatform(previous);platforms.push(p);top=p.y;}
 platforms=platforms.filter(p=>p.y<cameraY+H+120);
}
function update(){
 frame++;
 if(player.jumpBuffer>0)player.jumpBuffer--;
 if(player.coyote>0)player.coyote--;
 player.x+=player.vx;
 // 足場の切れ目側にだけ壁を置く。安全地帯には壁を置かない。
 for(const p of platforms){
  if(!p.wallSide)continue;
  const sides=p.wallSide==='both'?['left','right']:[p.wallSide];
  for(const side of sides){
   const wx=side==='left'?p.x-16:p.x+p.w;
   const touching=player.y+player.h>p.y-72&&player.y<p.y+14&&player.x+player.w>wx&&player.x<wx+16;
   if(touching){
    if(side==='left'&&player.vx<0){player.x=wx+16;player.vx=SPEED;}
    if(side==='right'&&player.vx>0){player.x=wx-player.w;player.vx=-SPEED;}
   }
  }
 }
 player.x=Math.max(-player.w+8,Math.min(W-8,player.x));
 const oldBottom=player.y+player.h;player.vy+=GRAVITY;player.y+=player.vy;player.onGround=false;
 if(player.vy>=0){
  for(const p of platforms){
   if(oldBottom<=p.y+3&&player.y+player.h>=p.y&&player.x+player.w>p.x&&player.x<p.x+p.w){
    player.y=p.y-player.h;player.vy=0;player.onGround=true;player.coyote=8;player.jumpsUsed=0;
    if(!p.base&&p.level>floor){
     floor=p.level;best=Math.max(best,floor);floorEl.textContent=floor;bestEl.textContent=best;
     try{localStorage.setItem('dopaup_best',String(best));}catch(e){}
     combo++;comboEl.innerHTML=combo+'<em>×</em>';
     const playerCenter=player.x+player.w/2,platformCenter=p.x+p.w/2;
     const perfect=Math.abs(playerCenter-platformCenter)<=p.w*.18;
     spawnBurst(playerCenter,p.y,perfect?'#eaff35':'#b64cff',perfect?24:12);
     addPopup(playerCenter,p.y-18,perfect?'PERFECT!':'+'+combo+' COMBO',perfect?'#eaff35':'#ffffff');
     playTone(perfect?880:620,perfect?.16:.07,perfect?'sawtooth':'triangle',perfect?.055:.035);
     if(perfect){addPopup(playerCenter,p.y-42,'NICE LANDING!','#36e8ff');playTone(1180,.12,'sine',.035);}
     if(combo>1)playTone(420+Math.min(combo,15)*35,.09,'square',.018);
    }
    break;
   }
  }
 }
 if(player.jumpBuffer>0&&player.jumpsUsed<1){
  player.vy=JUMP;player.onGround=false;player.coyote=0;player.jumpsUsed++;player.jumpBuffer=0;
 }
 particles=particles.filter(a=>a.life>0);for(const a of particles){a.x+=a.vx;a.y+=a.vy;a.vy+=.08;a.life--;}
 popups=popups.filter(a=>a.life>0);for(const a of popups){a.y-=.7;a.life--;}
 const target=player.y-H*.48;if(target<cameraY)cameraY+=(target-cameraY)*.14;
 addPlatforms();if(player.y-cameraY>H+75)end();
}
function spawnBurst(x,y,color,count){const ox=x-(player.x+player.w/2),oy=y-player.y;for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,sp=1+Math.random()*3.5;particles.push({x:ox,y:oy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:42+Math.random()*16,max:58,color,size:2+Math.random()*3});}}
function addPopup(x,y,text,color){popups.push({x:x-(player.x+player.w/2),y:y-player.y,text,color,life:66});}
function draw(){
 ctx.clearRect(0,0,W,H);
 const zone=Math.floor((floor-1)/10),zoneNames=['NEON CITY','SUNSET DISTRICT','CLOUD NINE','CYBER SPACE','GLITCH ZONE'],zoneColors=[['#17294a','#253b58','#101827'],['#592b59','#a94f68','#30213f'],['#397c9c','#a8d8e8','#244d70'],['#111536','#303d78','#090d25'],['#35134e','#762d88','#130d2c']];
 const palette=zoneColors[Math.min(zone,4)],sky=ctx.createLinearGradient(0,0,0,H);
 sky.addColorStop(0,palette[0]);sky.addColorStop(.56,palette[1]);sky.addColorStop(1,palette[2]);ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 const drift=(cameraY*.2)%260;
 if(zone===0||zone===1){
  if(zone===1){ctx.fillStyle='#ffb56a55';ctx.beginPath();ctx.arc(365,145,66,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd49b';ctx.beginPath();ctx.arc(365,145,43,0,Math.PI*2);ctx.fill();}
  for(let layer=0;layer<3;layer++){const baseY=H-25+drift+layer*95;for(let i=0;i<15;i++){const bw=20+(i*19%35),bx=(i*47+layer*23)%W,bh=55+((i*67+layer*41)%180),by=baseY-bh;ctx.fillStyle=zone===0?['#101b32','#182747','#203456'][layer]:['#291b3d','#43264e','#633052'][layer];ctx.fillRect(bx,by,bw,bh);ctx.fillStyle=zone===0?'#d7ff3545':'#ffc16b55';for(let wy=by+10;wy<baseY-7;wy+=14)for(let wx=bx+5;wx<bx+bw-3;wx+=10)ctx.fillRect(wx,wy,4,5);}}
 }else if(zone===2){
  const cloudShift=(cameraY*.32)%300;for(let i=0;i<12;i++){const x=(i*83+17)%W,y=((i*127+cloudShift)%850)-65;ctx.fillStyle=i%2?'#e8fbff35':'#ffffff55';ctx.beginPath();ctx.ellipse(x,y,58,17,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(x+23,y-10,34,18,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(x-24,y-5,29,14,0,0,Math.PI*2);ctx.fill();}
 }else{
  for(let i=0;i<95;i++){const x=(i*73+19)%W,y=(i*137+Math.floor(cameraY*.25))%H;ctx.fillStyle=i%5===0?'#eaff35':'#ffffff';ctx.globalAlpha=.25+(i%4)*.16;ctx.fillRect(x,y,i%5===0?3:2,i%5===0?3:2);}ctx.globalAlpha=1;
  if(zone>=3){ctx.strokeStyle=zone===3?'#5ceaff33':'#ff5bfa44';ctx.lineWidth=2;for(let i=0;i<4;i++){ctx.beginPath();ctx.ellipse(240,350,95+i*48,25+i*19,Math.PI/5,0,Math.PI*2);ctx.stroke();}}
 }
 ctx.fillStyle='#080d1680';ctx.fillRect(0,0,LEFT,H);ctx.fillRect(RIGHT,0,W-RIGHT,H);
 ctx.save();ctx.translate(0,-cameraY);
 for(let y=Math.floor(cameraY/60)*60;y<cameraY+H+60;y+=60){ctx.strokeStyle='#d7ff350b';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(LEFT,y);ctx.lineTo(RIGHT,y);ctx.stroke();}
 for(const p of platforms){
  if(p.wallSide){
   const sides=p.wallSide==='both'?['left','right']:[p.wallSide];
   for(const side of sides){
    const wx=side==='left'?p.x-16:p.x+p.w;
    ctx.fillStyle='#8793a8';ctx.fillRect(wx,p.y-72,16,86);
    ctx.fillStyle='#d7ff35';ctx.fillRect(wx,p.y-72,16,4);ctx.fillRect(wx,p.y+10,16,4);
    ctx.fillStyle='#ffffff66';ctx.fillRect(wx+(side==='left'?12:0),p.y-72,4,86);
    ctx.fillStyle='#30394a';for(let wy=p.y-58;wy<p.y+5;wy+=18)ctx.fillRect(wx+3,wy,10,3);
   }
  }
  ctx.fillStyle=p.base?'#69734a':p.safe?'#526b45':'#414b5b';ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.fillStyle=p.base||p.safe?'#d7ff35':'#a855f7';ctx.fillRect(p.x,p.y,p.w,4);
  if(!p.base){ctx.fillStyle='#ffffff18';ctx.fillRect(p.x+7,p.y+7,Math.max(0,p.w-14),2);}
 }
 ctx.fillStyle='#0005';ctx.fillRect(player.x+3,player.y+player.h+3,player.w,5);
 drawCharacter(ctx,player.x,player.y,selectedCharacter,frame);
 for(const a of particles){ctx.globalAlpha=Math.max(0,a.life/a.max);ctx.fillStyle=a.color;ctx.shadowColor=a.color;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(player.x+player.w/2+a.x,player.y+a.y,a.size,0,Math.PI*2);ctx.fill();}
 ctx.shadowBlur=0;ctx.globalAlpha=1;
 for(const a of popups){ctx.globalAlpha=Math.min(1,a.life/12);ctx.fillStyle=a.color;ctx.shadowColor=a.color;ctx.shadowBlur=14;ctx.font='1000 17px system-ui';ctx.textAlign='center';ctx.fillText(a.text,player.x+player.w/2+a.x,player.y+a.y);}
 ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.textAlign='left';
 ctx.restore();
 ctx.fillStyle='#d7ff35';ctx.font='900 11px system-ui';ctx.fillText('↑  CLIMB HIGHER',18,27);
 ctx.fillStyle='#ffffff';ctx.font='1000 10px system-ui';ctx.textAlign='right';ctx.fillText('ZONE '+String(Math.min(zone+1,5)).padStart(2,'0')+' / '+zoneNames[Math.min(zone,4)],W-18,27);ctx.textAlign='left';
}
function loop(t){
 if(!running)return;
 requestAnimationFrame(loop);
 try{
  const dt=Math.min((t-lastTime)/16.67,2);lastTime=t;
  for(let i=0;i<Math.max(1,Math.round(dt));i++)update();
  draw();
 }catch(err){
  running=false;overlay.style.display='flex';ovtitle.textContent='GAME ERROR';
  ovtext.textContent='処理エラー：'+(err&&err.message?err.message:String(err));
  startBtn.textContent='RETRY';
  console.error('DOPAUP runtime error:',err);
 }
}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();jump();});
// iOS Safariなどでのダブルタップ拡大をtouchstart段階で防ぐ
canvas.addEventListener('touchstart',e=>{e.preventDefault();jump();},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();},{passive:false});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
// モバイルブラウザのダブルタップ・ピンチによるページ拡大を抑止
 document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
 document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
 document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});
 document.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});
window.addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!running)start();else jump();}});
soundBtn.addEventListener('click',()=>{soundMuted=!soundMuted;try{localStorage.setItem('dopaup_muted',String(soundMuted));}catch(e){}syncSoundButton();if(!soundMuted)playTone(740,.1,'sine');});
syncSoundButton();document.querySelectorAll('.charChoice').forEach(button=>button.addEventListener('click',()=>{if(running)return;selectedCharacter=Number(button.dataset.char);try{localStorage.setItem('dopaup_character',String(selectedCharacter));}catch(e){}renderCharacterPicker();}));startBtn.addEventListener('click',start);renderCharacterPicker();reset();bestEl.textContent=best;draw();
})();
</script>
</body>
</html>
