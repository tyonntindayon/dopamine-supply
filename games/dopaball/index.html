<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOPABALL | DOPAMINE SUPPLY</title>

<script src="https://cdn.jsdelivr.net/gh/kitao/pyxel/wasm/pyxel.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 25px 16px 50px;
  background: #f4f6ff;
  color: #17172c;
  font-family: Arial, sans-serif;
}

.back {
  display: inline-block;
  margin-bottom: 22px;
  color: #3155e7;
  font-weight: bold;
  text-decoration: none;
}

.container {
  max-width: 1000px;
  margin: auto;
}

.heading {
  text-align: center;
  margin-bottom: 22px;
}

.heading h1 {
  margin: 0;
  font-size: clamp(36px, 7vw, 65px);
  color: #3155e7;
  font-weight: 900;
  letter-spacing: -2px;
}

.heading p {
  color: #777b99;
  font-size: 14px;
}

.game-frame {
  padding: 15px;
  background: white;
  border: 4px solid #3155e7;
  border-radius: 20px;
  box-shadow: 0 8px 0 #b9c7ff;
}

.game-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  font-weight: 900;
}

.game-title span:last-child {
  color: #ff3c9e;
  font-size: 12px;
}

.game-area {
  width: 100%;
  min-height: 300px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #15152c;
  border-radius: 12px;
  overflow: hidden;
}

/* Pyxelのゲーム画面 */
pyxel-run {
  display: block;
  max-width: 100%;
}

pyxel-run canvas {
  display: block;
  max-width: 100%;
  height: auto;
  image-rendering: pixelated;
}

.instructions {
  margin-top: 25px;
  padding: 22px;
  background: white;
  border-radius: 16px;
}

.instructions h2 {
  margin-top: 0;
  color: #3155e7;
  font-size: 20px;
}

.instructions p {
  font-size: 14px;
  line-height: 1.8;
  color: #555;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.control {
  background: #edf0ff;
  border-radius: 10px;
  padding: 10px 15px;
  font-size: 13px;
  font-weight: bold;
}

footer {
  text-align: center;
  margin-top: 35px;
  color: #9294a7;
  font-size: 11px;
}
</style>
</head>

<body>
<div class="container">

<a class="back" href="/">← DOPAMINE SUPPLYへ戻る</a>

<div class="heading">
  <h1>DOPABALL</h1>
  <p>KEEP THE BALL ALIVE. GET YOUR FEVER!</p>
</div>

<div class="game-frame">
  <div class="game-title">
    <span>🎮 DOPABALL</span>
    <span>DEVELOPED BY TGAMES</span>
  </div>

  <div class="game-area">
    <pyxel-run
      root="https://cdn.jsdelivr.net/gh/tyonntindayon/squash-fever@6b7c2806b5398770c10b2f7be38754235ddf7a03"
      name="main.py">
    </pyxel-run>
  </div>
</div>

<div class="instructions">
  <h2>HOW TO PLAY</h2>
  <p>
    ボールをパドルで跳ね返し、コンボをつなげよう！
    コンボを重ねるとスコア倍率が上昇。
    FEVER状態を目指そう！
  </p>

  <div class="controls">
    <div class="control">← →：パドル移動</div>
    <div class="control">マウス：パドル操作</div>
    <div class="control">SPACE：リトライ</div>
  </div>
</div>

<footer>
  © 2026 Tgames / DOPAMINE SUPPLY
</footer>

</div>
</body>
</html>
